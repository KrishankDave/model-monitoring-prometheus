
name: Model Monitoring CI Pipeline

on:
  push:
    branches:
      - mlops-ci-cd

  pull_request:
    branches:
      - mlops-ci-cd

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Test Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Validate Docker Compose
        run: docker compose config --quiet

      - name: Build Docker Images
        run: docker compose build drift_monitoring_service model_api

      - name: Run Unit Tests
        run: |
          docker compose run --rm --no-deps drift_monitoring_service \
            python3 -m pytest -q tests/test_stat_tests.py

      - name: Validate Streamlit Syntax
        run: |
          docker compose run --rm --no-deps drift_monitoring_service \
            python3 -m py_compile streamlit_app.py

      - name: Pipeline Completed
        run: echo "Model Monitoring CI Pipeline completed successfully!"
